name: Sidekick Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Cut a signed development build from any branch without tagging: Actions >
  # Sidekick Build > Run workflow. The assets are attached to the run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release-config:
    name: Validate GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check --config .goreleaser.yaml

  # Linux and Windows are pure Go (no cgo), so both cross-compile from Linux.
  build-linux-windows:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null .

  # The macOS tray needs cgo (Cocoa), so it builds on a macOS runner. The
  # runner cross-builds the other architecture with the same clang toolchain.
  build-darwin:
    name: Build (darwin/${{ matrix.goarch }})
    runs-on: macos-15
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up Sparkle
        run: |
          sparkle_dir="$(scripts/setup-sparkle.sh)"
          {
            echo "SPARKLE_DIR=$sparkle_dir"
            echo "CGO_CFLAGS=-F$sparkle_dir"
            echo "CGO_LDFLAGS=-F$sparkle_dir -Wl,-rpath,@executable_path/../Frameworks"
          } >> "$GITHUB_ENV"
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: go build -o /dev/null .
      - name: Test
        # Native only: the darwin-only tests run here, not on the Linux job.
        if: matrix.goarch == 'arm64'
        env:
          CGO_ENABLED: '1'
          DYLD_FRAMEWORK_PATH: ${{ env.SPARKLE_DIR }}
        run: go test -race -count=1 ./...

  # Packages macOS (universal .app in a ZIP and DMG), Windows (portable and
  # setup executables), and Linux. Runs on macOS because the darwin tray needs
  # cgo; windows/linux cross-compile.
  # Tags publish a GitHub Release; manual runs upload an artifact instead.
  package:
    name: Package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-config, build-linux-windows, build-darwin]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Require project-owned update keys
        run: |
          test -s packaging/sparkle-public-key.txt
          test -n "$UPDATE_SIGNING_KEY"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$SPARKLE_PRIVATE_ED_KEY"
          fi
      - name: Set up Sparkle
        run: |
          sparkle_dir="$(scripts/setup-sparkle.sh)"
          {
            echo "SPARKLE_DIR=$sparkle_dir"
            echo "CGO_CFLAGS=-F$sparkle_dir"
            echo "CGO_LDFLAGS=-F$sparkle_dir -Wl,-rpath,@executable_path/../Frameworks"
          } >> "$GITHUB_ENV"
      - name: Tag manual build for GoReleaser
        if: github.event_name == 'workflow_dispatch'
        run: git tag "v0.0.0-dev.${GITHUB_RUN_NUMBER}"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=publish --config .goreleaser.yaml
      - name: Install Windows installer tooling
        run: brew install nsis
      - name: Collect portable Windows assets
        run: |
          for arch in amd64 arm64; do
            source="$(find dist -path "*windows_${arch}*" -name chronicle-sidekick.exe -print -quit)"
            test -n "$source"
            cp "$source" "dist/Chronicle-Sidekick-windows-${arch}.exe"
          done
      - name: Build Windows installers
        run: |
          version="$(git describe --tags --exact-match HEAD)"
          version="${version#v}"
          for arch in amd64 arm64; do
            makensis \
              -DVERSION="$version" \
              -DARCH="$arch" \
              -DSOURCE="$PWD/dist/Chronicle-Sidekick-windows-${arch}.exe" \
              -DICON="$PWD/packaging/AppIcon.ico" \
              -DOUTPUT="$PWD/dist/Chronicle-Sidekick-Setup-windows-${arch}.exe" \
              packaging/windows-installer.nsi
          done
      - name: Build macOS disk image
        run: scripts/macos-dmg.sh dist/Chronicle-Sidekick-macos.zip dist/Chronicle-Sidekick-macos.dmg
      - name: Authenticate assets
        run: |
          cd dist
          assets=(
            Chronicle-Sidekick-macos.zip
            Chronicle-Sidekick-macos.dmg
            Chronicle-Sidekick-windows-amd64.exe
            Chronicle-Sidekick-windows-arm64.exe
            Chronicle-Sidekick-Setup-windows-amd64.exe
            Chronicle-Sidekick-Setup-windows-arm64.exe
            Chronicle-Sidekick-linux-amd64.tar.gz
            Chronicle-Sidekick-linux-arm64.tar.gz
          )
          shasum -a 256 "${assets[@]}" > checksums.txt
          shasum -a 256 -c checksums.txt
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$UPDATE_SIGNING_KEY" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out checksums.txt.sig checksums.txt
          openssl dgst -sha256 -verify <(openssl x509 -in ../internal/update/update-signing-cert.pem -pubkey -noout) \
            -signature checksums.txt.sig checksums.txt
      - name: Generate signed Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          appcast_dir="$(mktemp -d)"
          trap 'rm -rf "$appcast_dir"' EXIT
          cp dist/Chronicle-Sidekick-macos.zip "$appcast_dir/"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | \
            "$SPARKLE_DIR/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/Emyrk/chronicle-sidekick/releases/download/$GITHUB_REF_NAME/" \
              "$appcast_dir"
          cp "$appcast_dir/appcast.xml" dist/appcast.xml
      - uses: actions/upload-artifact@v7
        with:
          name: chronicle-sidekick
          retention-days: 14
          path: |
            dist/Chronicle-Sidekick-macos.zip
            dist/Chronicle-Sidekick-macos.dmg
            dist/Chronicle-Sidekick-windows-amd64.exe
            dist/Chronicle-Sidekick-windows-arm64.exe
            dist/Chronicle-Sidekick-Setup-windows-amd64.exe
            dist/Chronicle-Sidekick-Setup-windows-arm64.exe
            dist/Chronicle-Sidekick-linux-amd64.tar.gz
            dist/Chronicle-Sidekick-linux-arm64.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/appcast.xml
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            dist/Chronicle-Sidekick-macos.zip
            dist/Chronicle-Sidekick-macos.dmg
            dist/Chronicle-Sidekick-windows-amd64.exe
            dist/Chronicle-Sidekick-windows-arm64.exe
            dist/Chronicle-Sidekick-Setup-windows-amd64.exe
            dist/Chronicle-Sidekick-Setup-windows-arm64.exe
            dist/Chronicle-Sidekick-linux-amd64.tar.gz
            dist/Chronicle-Sidekick-linux-arm64.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/appcast.xml
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Chronicle Sidekick ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
