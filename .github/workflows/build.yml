name: Sidekick Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Cut an unsigned build from any branch without tagging: Actions > Sidekick
  # Build > Run workflow. The assets are attached to the run as an artifact.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release-config:
    name: Validate GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check --config .goreleaser.yaml

  # Linux and Windows are pure Go (no cgo), so both cross-compile from Linux.
  build-linux-windows:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null .

  # The macOS tray needs cgo (Cocoa), so it builds on a macOS runner. The
  # runner cross-builds the other architecture with the same clang toolchain.
  build-darwin:
    name: Build (darwin/${{ matrix.goarch }})
    runs-on: macos-15
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: go build -o /dev/null .
      - name: Test
        # Native only: the darwin-only tests run here, not on the Linux job.
        if: matrix.goarch == 'arm64'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

  # Packages macOS (universal .app in a .zip), Windows and Linux. Runs on
  # macOS because the darwin tray needs cgo; windows/linux cross-compile.
  # Tags publish a GitHub Release; manual runs upload an artifact instead.
  package:
    name: Package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-config, build-linux-windows, build-darwin]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Tag manual build for GoReleaser
        if: github.event_name == 'workflow_dispatch'
        run: git tag "v0.0.0-dev.${GITHUB_RUN_NUMBER}"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=publish --config .goreleaser.yaml
      - name: Collect assets and checksum
        # The windows "binary" archive is not a file in dist/ under its release
        # name, so copy it there; then checksum every shipped file.
        run: |
          cp "$(find dist -name chronicle-sidekick.exe -print -quit)" dist/Chronicle-Sidekick-windows-amd64.exe
          cd dist
          shasum -a 256 Chronicle-Sidekick-macos.zip Chronicle-Sidekick-windows-amd64.exe Chronicle-Sidekick-linux-amd64.tar.gz > checksums.txt
          shasum -a 256 -c checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: chronicle-sidekick
          retention-days: 14
          path: |
            dist/Chronicle-Sidekick-macos.zip
            dist/Chronicle-Sidekick-windows-amd64.exe
            dist/Chronicle-Sidekick-linux-amd64.tar.gz
            dist/checksums.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            dist/Chronicle-Sidekick-macos.zip
            dist/Chronicle-Sidekick-windows-amd64.exe
            dist/Chronicle-Sidekick-linux-amd64.tar.gz
            dist/checksums.txt
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Chronicle Sidekick ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
